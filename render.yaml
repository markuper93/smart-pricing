services:
  - type: web
    name: smart-pricing-backend
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: cd backend && uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: smart-pricing-db
          property: connectionString
      - key: ADMIN_PASS
        generateValue: true
      - key: ADMIN_EMAIL
        value: admin@smartpricing.co.il
      - key: ADMIN_USERNAME
        value: admin
      - key: CORS_ORIGINS
        sync: false  # Set after Vercel deploy
      - key: TOKEN_EXPIRE_MINUTES
        value: 480

databases:
  - name: smart-pricing-db
    plan: starter
    databaseName: smart_pricing
    user: smart_pricing_user
